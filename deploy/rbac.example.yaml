# Template only. Replace namespace "apps" and bind the Roles to your diagnostic identity.
# This file intentionally creates no RoleBinding and no broad ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: istio-diagnostics-reader
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules", "serviceentries", "gateways", "sidecars"]
    verbs: ["get", "list"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "peerauthentications", "requestauthentications"]
    verbs: ["get", "list"]
---
# OPTIONAL: istioctl may need exec to read the Envoy admin dump through pilot-agent.
# Kubernetes pods/exec permission itself allows more than read-only operations.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: istio-diagnostics-proxy-inspection
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
