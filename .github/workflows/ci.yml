name: Design contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l docs/design/validate_contracts.go)"
      - name: Validate design contracts and playbooks
        run: go run -mod=readonly docs/design/validate_contracts.go
